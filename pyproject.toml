[project]
name = "etf-agent"
version = "0.1.0"
description = "Suggest ETF portfolios for a target sector mix using 1/3/12-month relative performance and reward/risk"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
etf-agent = "etf_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["etf_agent"]

[tool.setuptools.package-data]
etf_agent = ["universe.json", "fidelity_funds.json"]
